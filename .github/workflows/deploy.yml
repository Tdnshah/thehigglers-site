name: Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build site
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0

      - name: Download dist artifact
        uses: actions/download-artifact@v4.1.0
        with:
          name: dist
          path: dist

      - name: Deploy to Virtualmin
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "📋 Deployment Configuration:"
          echo "  Host: $DEPLOY_HOST"
          echo "  User: $DEPLOY_USER"
          echo "  Path: $DEPLOY_PATH"

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Create backup of current build and directories
          echo "📦 Preparing server..."
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            source /etc/profile 2>/dev/null || true
            source ~/.bashrc 2>/dev/null || true
            echo 'Working directory:' \$(pwd)
            echo 'Deploy path: $DEPLOY_PATH'
            cd $DEPLOY_PATH
            echo 'Changed to: ' \$(pwd)
            if [ -d dist ]; then
              timestamp=\$(date +%Y%m%d_%H%M%S)
              mv dist dist.backup.\$timestamp
              echo \"✅ Backed up previous build to dist.backup.\$timestamp\"
            fi
            mkdir -p node_modules uploads
            echo '✅ Directories ready'
          "

          # Upload new build
          echo "📤 Uploading built files..."
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/dist/"

          # Restart the app
          echo "🔄 Restarting application..."
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            source /etc/profile 2>/dev/null || true
            source ~/.bashrc 2>/dev/null || true
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\$PATH
            cd $DEPLOY_PATH
            echo 'Node version:' \$(node --version)
            echo 'Using npx to run PM2...'
            npx pm2 restart thehigglers --update-env 2>/dev/null || npx pm2 start --name thehigglers npm -- start
            npx pm2 save
            echo '✅ Deployment complete!'
          "
