name: Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build site
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Virtualmin
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "📋 Deployment Configuration:"
          echo "  Host: $DEPLOY_HOST"
          echo "  User: $DEPLOY_USER"
          echo "  Path: $DEPLOY_PATH"

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_CMD="ssh -i ${HOME}/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST}"

          echo "📦 Backing up previous build..."
          $SSH_CMD "cd $DEPLOY_PATH && if [ -d dist ]; then mv dist dist.backup.\$(date +%Y%m%d_%H%M%S); fi; mkdir -p uploads"

          echo "📤 Uploading built files..."
          rsync -avz --delete \
            -e "ssh -i ${HOME}/.ssh/deploy_key" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/dist/"

          echo "📤 Uploading package manifest for production dependencies..."
          rsync -avz \
            -e "ssh -i ${HOME}/.ssh/deploy_key" \
            package.json pnpm-lock.yaml pnpm-workspace.yaml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

          echo "📦 Installing production dependencies on server..."
          $SSH_CMD "bash -ic 'cd $DEPLOY_PATH && (command -v pnpm >/dev/null 2>&1 || npm install -g pnpm) && pnpm install --prod --frozen-lockfile'"

          echo "📝 Writing PM2 ecosystem config..."
          cat > ecosystem.config.cjs <<EOF
          module.exports = {
            apps: [{
              name: 'thehigglers',
              script: '${DEPLOY_PATH}/dist/server/entry.mjs',
              cwd: '${DEPLOY_PATH}',
              env: {
                NODE_ENV: 'production',
                DATABASE_URL: '${PROD_DATABASE_URL}',
                UPLOADS_DIR: '${DEPLOY_PATH}/uploads',
                HOST: '0.0.0.0',
                PORT: '3000'
              }
            }]
          }
          EOF

          scp -i "${HOME}/.ssh/deploy_key" ecosystem.config.cjs "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/ecosystem.config.cjs"

          echo "🔄 Restarting application..."
          $SSH_CMD "bash -ic 'cd $DEPLOY_PATH && echo \"node: \$(node --version)\" && echo \"pm2: \$(which pm2)\" && pm2 delete thehigglers >/dev/null 2>&1; pm2 start ecosystem.config.cjs && pm2 save'"

          echo "📋 Recent logs:"
          $SSH_CMD "bash -ic 'pm2 logs thehigglers --lines 15 --nostream'"

          echo "✅ Deployment complete!"
